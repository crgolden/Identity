name: Build and deploy ASP.Net Core app to Azure Web App - crgolden-identity

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      loadRequestScale:
        description: 'Load test request multiplier; vars.LOAD_REQUEST_SCALE when empty'
        required: false
      loadMaxFailRate:
        description: 'Load test fail-rate ceiling (0-1) for discovery and JWKS; vars.LOAD_MAX_FAIL_RATE when empty'
        required: false
      loadMaxLoginFailRate:
        description: 'Load test fail-rate ceiling (0-1) for the login page; vars.LOAD_MAX_LOGIN_FAIL_RATE when empty'
        required: false

defaults:
  run:
    shell: pwsh

jobs:
  sync-lock-files:
    name: Sync Dependabot lock files
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
      - uses: actions/checkout@v6
        if: github.actor == 'dependabot[bot]'
        with:
          ref: ${{ github.head_ref }}

      - name: Set up .NET Core
        if: github.actor == 'dependabot[bot]'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Regenerate lock files and push
        if: github.actor == 'dependabot[bot]'
        env:
          NuGetPackageSourceCredentials_GitHub: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          dotnet restore --force-evaluate
          if (-not (git status --porcelain -- '*packages.lock.json')) {
            Write-Output 'Lock files already consistent; nothing to push.'
            exit 0
          }
          git config user.name 'dependabot[bot]'
          git config user.email '49699333+dependabot[bot]@users.noreply.github.com'
          git add -- '*packages.lock.json'
          git commit -m 'Regenerate packages.lock.json for transitive project references'
          git push origin "HEAD:$env:HEAD_REF"

  build:
    name: Build and analyze
    needs: sync-lock-files
    runs-on: ubuntu-latest
    concurrency:
      group: identity-e2e-database
      cancel-in-progress: false
      queue: max
    permissions:
      id-token: write #This is required for requesting the JWT (needed for Azure OIDC in E2E tests)
      contents: read #This is required for actions/checkout

    steps:
      - name: Set up JDK 21
        if: github.actor != 'dependabot[bot]'
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'zulu'

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.actor == 'dependabot[bot]' && github.head_ref || '' }}

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Cache SonarQube Cloud packages
        if: github.actor != 'dependabot[bot]'
        uses: actions/cache@v5
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarQube Cloud scanner
        id: cache-sonar-scanner
        if: github.actor != 'dependabot[bot]'
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarQube Cloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true' && github.actor != 'dependabot[bot]'
        run: |
          New-Item -Path ${{ runner.temp }}/scanner -ItemType Directory
          dotnet tool update dotnet-sonarscanner --tool-path ${{ runner.temp }}/scanner

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Cache dotnet global tools
        uses: actions/cache@v5
        with:
          path: ~/.dotnet/tools
          key: ${{ runner.os }}-dotnet-tools-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-dotnet-tools-

      - name: Install dotnet-coverage
        run: dotnet tool install --global dotnet-coverage

      - name: Restore local tools
        run: dotnet tool restore

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com

      - name: Install npm dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Audit dependencies (fails on high or critical)
        run: npm run audit

      - name: Begin Sonar analysis
        if: github.actor != 'dependabot[bot]'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          ${{ runner.temp }}/scanner/dotnet-sonarscanner begin `
            /k:"$env:SONAR_PROJECT_KEY" `
            /o:"$env:SONAR_ORGANIZATION" `
            /d:sonar.token="$env:SONAR_TOKEN" `
            /d:sonar.host.url="https://sonarcloud.io" `
            /d:sonar.cs.opencover.reportsPaths="coverage.opencover.xml" `
            /d:sonar.cs.vscoveragexml.reportsPaths="coverage-e2e.xml,coverage-integration.xml" `
            /d:sonar.exclusions="**/bin/**,**/obj/**" `
            /d:sonar.coverage.exclusions="**/Program.cs,**/gate.ps1" `
            /d:sonar.qualitygate.wait=true `
            /d:sonar.scanner.skipJreProvisioning=true

      - name: Build with dotnet
        env:
          NuGetPackageSourceCredentials_GitHub: Username=${{ github.actor }};Password=${{ secrets.PACKAGES_READ_TOKEN }}
        run: dotnet build --no-incremental --configuration Release /p:RestoreLockedMode=true -warnaserror

      - name: ReSharper inspection (jb inspectcode)
        run: |
          dotnet jb inspectcode Identity.slnx --no-build -e=WARNING --output=inspectcode.sarif
          $results = @((Get-Content inspectcode.sarif -Raw | ConvertFrom-Json).runs | ForEach-Object { $_.results })
          foreach ($result in $results) {
            $location = $result.locations[0].physicalLocation
            Write-Output "::error file=$($location.artifactLocation.uri),line=$($location.region.startLine)::$($result.ruleId) $($result.message.text)"
          }
          if ($results.Count -gt 0) { exit 1 }

      - name: Run unit tests with coverage
        run: |
          dotnet coverlet Identity.Tests.Unit/bin/Release/net10.0 `
            --target "dotnet" `
            --targetargs "test --project Identity.Tests.Unit --no-build --configuration Release -- --filter-trait Category=Unit --stop-on-fail on --report-xunit-trx --report-xunit-trx-filename unit-tests.trx --results-directory=Identity.Tests.Unit/bin/Release/net10.0/TestResults" `
            --format opencover --output "coverage.opencover.xml" `
            --skipautoprops `
            --exclude-by-attribute GeneratedCodeAttribute `
            --exclude-by-file "**/obj/**" `
            --exclude-by-file "**/Program.cs" `
            --does-not-return-attribute DoesNotReturnAttribute `
            --include "[Identity]*" `
            --exclude "[Identity]*Pages_*"

      - name: Install SqlPackage
        if: github.actor != 'dependabot[bot]'
        run: dotnet tool install --global microsoft.sqlpackage

      - name: Deploy E2E test database schema
        if: github.actor != 'dependabot[bot]'
        env:
          DB_SERVER: ${{ vars.DB_SERVER }}
          DB_USERID: ${{ secrets.DB_USERID }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ vars.DB_NAME_E2E }}
        run: |
          $connStr = "Data Source=$env:DB_SERVER;Initial Catalog=$env:DB_NAME;User ID=$env:DB_USERID;Password='$env:DB_PASSWORD';Connect Timeout=30;Encrypt=True;Trust Server Certificate=False;Application Intent=ReadWrite;Multi Subnet Failover=False;Command Timeout=30"
          sqlpackage /Action:Publish /SourceFile:Identity.Data/bin/Release/Identity.Data.dacpac /TargetConnectionString:"$connStr"

      - name: Get Playwright version
        id: playwright-version
        if: github.actor != 'dependabot[bot]'
        shell: pwsh
        run: |
          $version = (Select-Xml -Path Identity.Tests.E2E/Identity.Tests.E2E.csproj `
            -XPath '//PackageReference[@Include="Microsoft.Playwright"]/@Version').Node.Value
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Cache Playwright browsers
        id: cache-playwright
        if: github.actor != 'dependabot[bot]'
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: github.actor != 'dependabot[bot]'
        run: pwsh "${{ github.workspace }}/Identity.Tests.E2E/bin/Release/net10.0/playwright.ps1" install --with-deps chromium

      - name: Create the HTTPS development certificate
        if: github.actor != 'dependabot[bot]'
        run: dotnet dev-certs https

      - name: Run E2E tests with coverage
        id: e2e
        if: github.actor != 'dependabot[bot]'
        env:
          ASPNETCORE_ENVIRONMENT: CI
          GoogleClientId: ${{ secrets.GOOGLE_CLIENT_ID }}
          GoogleClientSecret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          ReCAPTCHASiteKey: ${{ secrets.RECAPTCHA_SITE_KEY_E2E }}
          ReCAPTCHASecretKey: ${{ secrets.RECAPTCHA_SECRET_KEY }}
          SqlConnectionStringBuilder__DataSource: ${{ vars.DB_SERVER }}
          SqlConnectionStringBuilder__InitialCatalog: ${{ vars.DB_NAME_E2E }}
          SqlConnectionStringBuilder__IntegratedSecurity: false
          SqlConnectionStringBuilder__UserID: ${{ secrets.DB_USERID }}
          SqlConnectionStringBuilder__Password: ${{ secrets.DB_PASSWORD }}
          ServiceBusConnectionString: ${{ secrets.SERVICE_BUS_CONNECTION_STRING }}
          PasskeyOrigin: https://127.0.0.1
          PlaywrightSettings__Headless: ${{ vars.PLAYWRIGHT_HEADLESS }}
          PlaywrightSettings__TestResultsFolderName: ${{ vars.PLAYWRIGHT_TEST_RESULTS_FOLDER_NAME }}
          PlaywrightSettings__ArtifactsFolderName: ${{ vars.PLAYWRIGHT_ARTIFACTS_FOLDER_NAME }}
          PlaywrightSettings__TempFolderName: ${{ vars.PLAYWRIGHT_TEMP_FOLDER_NAME }}
          PlaywrightSettings__ScreenshotFileName: ${{ vars.PLAYWRIGHT_SCREENSHOT_FILE_NAME }}
          PlaywrightSettings__TraceFileName: ${{ vars.PLAYWRIGHT_TRACE_FILE_NAME }}
          PlaywrightSettings__BrowserLogFileName: ${{ vars.PLAYWRIGHT_BROWSER_LOG_FILE_NAME }}
          PlaywrightSettings__MetadataFileName: ${{ vars.PLAYWRIGHT_METADATA_FILE_NAME }}
          PlaywrightSettings__FailureFileName: ${{ vars.PLAYWRIGHT_FAILURE_FILE_NAME }}
          PlaywrightSettings__RecordedVideoWidth: ${{ vars.PLAYWRIGHT_RECORDED_VIDEO_WIDTH }}
          PlaywrightSettings__RecordedVideoHeight: ${{ vars.PLAYWRIGHT_RECORDED_VIDEO_HEIGHT }}
          PlaywrightSettings__MaxArtifactNameLength: ${{ vars.PLAYWRIGHT_MAX_ARTIFACT_NAME_LENGTH }}
          E2ESettings__IndependentlyPinnedAdminCardCount: ${{ vars.E2E_INDEPENDENTLY_PINNED_ADMIN_CARD_COUNT }}
        run: |
          dotnet-coverage collect `
            "dotnet test --project Identity.Tests.E2E --no-build --configuration Release -- --filter-trait Category=E2E --stop-on-fail on --report-xunit-trx --report-xunit-trx-filename e2e-tests.trx --results-directory=Identity.Tests.E2E/bin/Release/net10.0/${{ vars.PLAYWRIGHT_TEST_RESULTS_FOLDER_NAME }}" `
            -f xml -o "coverage-e2e.xml" -s "coverage.settings.xml"

      - name: Snapshot TCP state after an E2E failure
        if: ${{ !cancelled() && steps.e2e.outcome == 'failure' }}
        continue-on-error: true
        env:
          TCP_SNAPSHOT: Identity.Tests.E2E/bin/Release/net10.0/${{ vars.PLAYWRIGHT_TEST_RESULTS_FOLDER_NAME }}/tcp-state.txt
        shell: bash
        run: |
          {
            echo "Captured $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo '--- summary'
            ss -s
            echo '--- by state'
            ss -tanH | awk '{ print $1 }' | sort | uniq -c | sort -rn
            echo '--- TIME-WAIT by remote port'
            ss -tanH | awk '$1 == "TIME-WAIT" { n = split($5, peer, ":"); print peer[n] }' | sort | uniq -c | sort -rn | head -15
            echo '--- other states by owning process'
            sudo ss -tanpH | awk '$1 != "TIME-WAIT"' | grep -o 'users:(("[^"]*",pid=[0-9]*' | sort | uniq -c | sort -rn | head -15
            echo '--- ephemeral port range'
            cat /proc/sys/net/ipv4/ip_local_port_range
            echo '--- socket memory'
            cat /proc/net/sockstat
          } | tee "$TCP_SNAPSHOT"

      - name: Locate the Cucumber messages report
        id: cucumber-report
        if: ${{ !cancelled() && (steps.e2e.outcome == 'success' || steps.e2e.outcome == 'failure') && github.actor != 'dependabot[bot]' }}
        run: |
          $relative = (Get-Content Identity.Tests.E2E/reqnroll.json -Raw | ConvertFrom-Json).formatters.message.outputFilePath
          $messages = "Identity.Tests.E2E/bin/Release/net10.0/$relative"
          "messages=$messages" >> $env:GITHUB_OUTPUT
          "directory=$(Split-Path $messages -Parent)" >> $env:GITHUB_OUTPUT

      - name: Assert E2E executed at least its floor
        if: steps.e2e.outcome == 'success'
        env:
          E2E_TRX: Identity.Tests.E2E/bin/Release/net10.0/${{ vars.PLAYWRIGHT_TEST_RESULTS_FOLDER_NAME }}/e2e-tests.trx
          CUCUMBER_MESSAGES: ${{ steps.cucumber-report.outputs.messages }}
        run: |
          $floor = [int](Get-Content Identity.Tests.E2E/e2e-settings.json -Raw | ConvertFrom-Json).executedTestFloor
          if (-not (Test-Path $env:E2E_TRX)) {
            Write-Output "::error::$env:E2E_TRX is missing - the E2E suite never reported."
            exit 1
          }
          $executed = [int]([xml](Get-Content $env:E2E_TRX -Raw)).TestRun.ResultSummary.Counters.executed
          $finished = if (Test-Path $env:CUCUMBER_MESSAGES) { @(Select-String -LiteralPath $env:CUCUMBER_MESSAGES -SimpleMatch '"testCaseFinished"').Count } else { 0 }
          "E2E executed $executed, Cucumber report finished $finished, floor $floor" >> $env:GITHUB_STEP_SUMMARY
          if ($floor -le 0 -or $executed -lt $floor -or $finished -lt $floor) {
            Write-Output "::error::E2E executed $executed and the Cucumber report finished $finished, below the floor of $floor."
            exit 1
          }

      - name: Run integration tests with coverage
        if: github.actor != 'dependabot[bot]'
        env:
          ASPNETCORE_ENVIRONMENT: CI
          GoogleClientId: ${{ secrets.GOOGLE_CLIENT_ID }}
          GoogleClientSecret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          ReCAPTCHASiteKey: ${{ secrets.RECAPTCHA_SITE_KEY_E2E }}
          ReCAPTCHASecretKey: ${{ secrets.RECAPTCHA_SECRET_KEY }}
          SqlConnectionStringBuilder__DataSource: ${{ vars.DB_SERVER }}
          SqlConnectionStringBuilder__InitialCatalog: ${{ vars.DB_NAME_E2E }}
          SqlConnectionStringBuilder__IntegratedSecurity: false
          SqlConnectionStringBuilder__UserID: ${{ secrets.DB_USERID }}
          SqlConnectionStringBuilder__Password: ${{ secrets.DB_PASSWORD }}
          ServiceBusConnectionString: ${{ secrets.SERVICE_BUS_CONNECTION_STRING }}
          PasskeyOrigin: https://127.0.0.1
          E2ESettings__IndependentlyPinnedAdminCardCount: ${{ vars.E2E_INDEPENDENTLY_PINNED_ADMIN_CARD_COUNT }}
        run: |
          dotnet-coverage collect `
            "dotnet test --project Identity.Tests.Integration --no-build --configuration Release -- --filter-trait Category=Integration --stop-on-fail on --report-xunit-trx --report-xunit-trx-filename integration-tests.trx --results-directory=Identity.Tests.Integration/bin/Release/net10.0/TestResults" `
            -f xml -o "coverage-integration.xml" -s "coverage.settings.xml"

      - name: Publish E2E scenario results
        if: ${{ !cancelled() && steps.cucumber-report.outcome == 'success' }}
        env:
          PGHOST: ${{ vars.TEST_RESULTS_PGHOST }}
          PGDATABASE: ${{ vars.TEST_RESULTS_PGDATABASE }}
          PGUSER: ${{ vars.TEST_RESULTS_PGUSER }}
          PGSSLMODE: ${{ vars.TEST_RESULTS_PGSSLMODE }}
          PGPASSWORD: ${{ secrets.TEST_RESULTS_PGPASSWORD }}
        run: npx --no -- publish-bdd-results --app ${{ vars.TEST_RESULTS_APP }} ${{ steps.cucumber-report.outputs.messages }}

      - name: Upload Cucumber report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always() && steps.cucumber-report.outcome == 'success'
        with:
          name: identity-cucumber-report
          path: ${{ steps.cucumber-report.outputs.directory }}
          if-no-files-found: ignore

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always() && github.actor != 'dependabot[bot]'
        with:
          name: test-results
          if-no-files-found: error
          path: |
            Identity.Tests.Unit/bin/Release/net10.0/TestResults/
            Identity.Tests.E2E/bin/Release/net10.0/${{ vars.PLAYWRIGHT_TEST_RESULTS_FOLDER_NAME }}/
            Identity.Tests.Integration/bin/Release/net10.0/TestResults/

      - name: Upload Playwright failure artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always() && github.actor != 'dependabot[bot]'
        with:
          name: identity-playwright-artifacts
          path: Identity.Tests.E2E/bin/Release/net10.0/${{ vars.PLAYWRIGHT_TEST_RESULTS_FOLDER_NAME }}/${{ vars.PLAYWRIGHT_ARTIFACTS_FOLDER_NAME }}/
          if-no-files-found: ignore

      - name: Run load tests
        if: github.event_name == 'workflow_dispatch'
        env:
          ASPNETCORE_ENVIRONMENT: CI
          GoogleClientId: ${{ secrets.GOOGLE_CLIENT_ID }}
          GoogleClientSecret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          ReCAPTCHASiteKey: ${{ secrets.RECAPTCHA_SITE_KEY_E2E }}
          ReCAPTCHASecretKey: ${{ secrets.RECAPTCHA_SECRET_KEY }}
          SqlConnectionStringBuilder__DataSource: ${{ vars.DB_SERVER }}
          SqlConnectionStringBuilder__InitialCatalog: ${{ vars.DB_NAME_E2E }}
          SqlConnectionStringBuilder__IntegratedSecurity: false
          SqlConnectionStringBuilder__UserID: ${{ secrets.DB_USERID }}
          SqlConnectionStringBuilder__Password: ${{ secrets.DB_PASSWORD }}
          ServiceBusConnectionString: ${{ secrets.SERVICE_BUS_CONNECTION_STRING }}
          PasskeyOrigin: https://127.0.0.1
          E2ESettings__IndependentlyPinnedAdminCardCount: ${{ vars.E2E_INDEPENDENTLY_PINNED_ADMIN_CARD_COUNT }}
          LoadSettings__RequestScale: ${{ inputs.loadRequestScale || vars.LOAD_REQUEST_SCALE }}
          LoadSettings__MaxRequests: ${{ vars.LOAD_MAX_REQUESTS }}
          LoadSettings__MaxFailRate: ${{ inputs.loadMaxFailRate || vars.LOAD_MAX_FAIL_RATE }}
          LoadSettings__MaxLoginFailRate: ${{ inputs.loadMaxLoginFailRate || vars.LOAD_MAX_LOGIN_FAIL_RATE }}
          LoadSettings__DiscoveryRequests: ${{ vars.LOAD_DISCOVERY_REQUESTS }}
          LoadSettings__DiscoveryParallelism: ${{ vars.LOAD_DISCOVERY_PARALLELISM }}
          LoadSettings__LoginRequests: ${{ vars.LOAD_LOGIN_REQUESTS }}
          LoadSettings__LoginParallelism: ${{ vars.LOAD_LOGIN_PARALLELISM }}
          LoadSettings__JwksRequests: ${{ vars.LOAD_JWKS_REQUESTS }}
          LoadSettings__JwksParallelism: ${{ vars.LOAD_JWKS_PARALLELISM }}
          LoadSettings__HealthRequests: ${{ vars.LOAD_HEALTH_REQUESTS }}
          LoadSettings__HealthParallelism: ${{ vars.LOAD_HEALTH_PARALLELISM }}
        run: |
          dotnet test --project Identity.Tests.Load --no-build --configuration Release -- --filter-trait Category=Load

      - name: dotnet publish
        env:
          NuGetPackageSourceCredentials_GitHub: Username=${{ github.actor }};Password=${{ secrets.PACKAGES_READ_TOKEN }}
        run: >
          dotnet publish Identity/Identity.csproj
          -c Release
          -r win-x86
          --self-contained false
          -o ${{ github.workspace }}/publish

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: .net-app
          path: ${{ github.workspace }}/publish

      - name: Upload dacpac for deployment job
        uses: actions/upload-artifact@v7
        with:
          name: sql-dacpac
          path: Identity.Data/bin/Release/Identity.Data.dacpac

      - name: End Sonar analysis
        if: github.actor != 'dependabot[bot]'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ${{ runner.temp }}/scanner/dotnet-sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"

      - name: Fail on open Sonar issues
        if: github.actor != 'dependabot[bot]'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $scope = if ($env:PULL_REQUEST) { "pullRequest=$env:PULL_REQUEST" } else { "branch=$env:BRANCH" }
          $auth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("$($env:SONAR_TOKEN):"))
          $report = Invoke-RestMethod -Headers @{ Authorization = "Basic $auth" } -Uri "https://sonarcloud.io/api/issues/search?componentKeys=$env:SONAR_PROJECT_KEY&$scope&issueStatuses=OPEN,CONFIRMED&ps=500"
          foreach ($issue in $report.issues) {
            Write-Output "::error file=$($issue.component -replace '^[^:]*:'),line=$($issue.line)::$($issue.rule) $($issue.message)"
          }
          Write-Output "$($report.total) open Sonar issue(s) on $scope"
          if ($null -eq $report.total -or $report.total -ne 0) { exit 1 }

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v7
        with:
          name: .net-app

      - name: Download dacpac from build job
        uses: actions/download-artifact@v7
        with:
          name: sql-dacpac

      - name: Cache dotnet global tools
        uses: actions/cache@v5
        with:
          path: ~/.dotnet/tools
          key: ${{ runner.os }}-dotnet-tools-deploy
          restore-keys: ${{ runner.os }}-dotnet-tools-

      - name: Login to Azure
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca  # v3.0.1
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_4533A76F9560447CBA73C7D19BFDC764 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_07B3DB796C7C4D409EFADCB306F23869 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_086A6E19353E42B0AFB0AEE6A7504B9E }}

      - name: Install SqlPackage
        run: dotnet tool install --global microsoft.sqlpackage

      - name: Deploy database
        env:
          DB_SERVER: ${{ vars.DB_SERVER }}
          DB_USERID: ${{ secrets.DB_USERID }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ vars.DB_NAME }}
        run: |
          $connStr = "Data Source=$env:DB_SERVER;Initial Catalog=$env:DB_NAME;User ID=$env:DB_USERID;Password='$env:DB_PASSWORD';Connect Timeout=30;Encrypt=True;Trust Server Certificate=False;Application Intent=ReadWrite;Multi Subnet Failover=False;Command Timeout=30"
          sqlpackage /Action:Publish /SourceFile:Identity.Data.dacpac /TargetConnectionString:"$connStr"

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383  # v3.0.8
        with:
          app-name: 'crgolden-identity'
          slot-name: 'Production'
          package: .

  mutation:
    name: Mutation testing
    runs-on: ubuntu-latest
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && github.actor != 'dependabot[bot]'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Restore local tools
        run: dotnet tool restore

      - name: Run Stryker mutation tests
        working-directory: Identity
        shell: pwsh
        env:
          STRYKER_DASHBOARD_API_KEY: ${{ secrets.STRYKER_DASHBOARD_API_KEY }}
          NuGetPackageSourceCredentials_GitHub: Username=${{ github.actor }};Password=${{ secrets.PACKAGES_READ_TOKEN }}
        run: |
          dotnet stryker --config-file ../stryker-config.json | Tee-Object -Variable strykerOutput
          $strykerExit = $LASTEXITCODE
          if ($strykerOutput -match 'Failed to upload report to the dashboard') {
            Write-Error 'Stryker ran, but its report did not reach the dashboard'
            exit 1
          }
          exit $strykerExit

      - name: Upload Stryker report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stryker-report
          if-no-files-found: warn
          path: Identity/StrykerOutput/**/*
